<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PacketPulse Globe</title>
    <style>
      :root {
        --bg: #02040a;
        --panel: rgba(8, 16, 30, 0.82);
        --border: rgba(90, 150, 220, 0.25);
        --text: #d8e6f5;
        --muted: #7f97b2;
        --green: #1aff8c;
        --amber: #ffb31f;
        --red: #ff3b3b;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
      #globe { position: fixed; inset: 0; }
      .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; backdrop-filter: blur(6px); max-width: calc(100vw - 32px); box-sizing: border-box; }
      #hud { top: 16px; left: 16px; min-width: 230px; }
      #hud h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: 0.08em; text-transform: uppercase; color: #9fd0ff; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
      #hud .row b { color: var(--text); font-weight: 600; }
      #hud .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      button { background: rgba(40, 80, 130, 0.35); color: var(--text); border: 1px solid var(--border);
        border-radius: 5px; padding: 4px 8px; font: inherit; cursor: pointer; }
      button:hover { background: rgba(60, 110, 170, 0.5); }
      button.active { border-color: #6fb6ff; color: #fff; }
      #status { margin-top: 6px; color: var(--muted); min-height: 1em; }
      #legend { bottom: 16px; left: 16px; display: flex; align-items: center; gap: 10px; }
      #legend .bar { width: 160px; height: 8px; border-radius: 4px;
        background: linear-gradient(90deg, #1aff8c 0%, #73ff4d 35%, #ffb31f 55%, #ff7314 80%, #ff1f1f 100%); }
      #inspector { top: 16px; right: 16px; width: 300px; display: none; max-height: calc(100vh - 300px); overflow-y: auto; }
      #inspector.open { display: block; }
      #inspector h2 { margin: 0 0 6px; font-size: 13px; }
      #inspector dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      #inspector dt { color: var(--muted); }
      #inspector dd { margin: 0; word-break: break-all; }
      #inspector .hops { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      #inspector .hops button { padding: 2px 6px; }
      .pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-weight: 600; }
      .pill.green { background: rgba(26, 255, 140, 0.15); color: var(--green); }
      .pill.amber { background: rgba(255, 179, 31, 0.15); color: var(--amber); }
      .pill.red { background: rgba(255, 59, 59, 0.18); color: var(--red); }
      #b-business { border-color: rgba(31, 209, 235, 0.45); }
      #b-business.active { background: rgba(31, 209, 235, 0.22); color: #fff; }
      #business { right: 16px; bottom: 16px; width: 380px; max-height: calc(100vh - 360px); min-height: 220px; display: none; flex-direction: column; overflow: hidden; }
      #business.open { display: flex; }
      #business .bm-head { display: flex; justify-content: space-between; align-items: center; }
      #business h2 { font-size: 13px; margin: 0; letter-spacing: 0.06em; text-transform: uppercase; color: #5fe3f5; }
      #business .bm-row { display: flex; gap: 8px; align-items: center; margin: 8px 0 4px; color: var(--muted); }
      #business select { flex: 1; background: #0b1626; color: var(--text); border: 1px solid var(--border); border-radius: 5px; font: inherit; padding: 3px; }
      #business .bm-profiles { font-size: 12px; margin: 4px 0; }
      #business .bm-counts { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; }
      #business .bm-counts i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
      #business .muted, #inspector .muted { color: var(--muted); }
      #business .err { color: var(--red); }
      #business .bm-tabs { display: flex; gap: 6px; margin: 6px 0; }
      #business .bm-body { overflow-y: auto; flex: 1; min-height: 0; }
      #business .bm-alert { border-left: 3px solid var(--red); padding: 4px 8px; margin: 6px 0; background: rgba(255, 59, 59, 0.06); cursor: pointer; font-size: 12px; }
      #business .bm-alert.suspected { border-left-color: var(--amber); background: rgba(255, 179, 31, 0.06); }
      #business .bm-alert:hover { background: rgba(255, 255, 255, 0.07); }
      #business .bm-alert .rec { color: #9fe8f2; margin-top: 2px; }
      #business .sev { text-transform: uppercase; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 3px; background: rgba(255, 59, 59, 0.25); color: #ffb3b3; }
      #business .sev.info, #business .sev.low { background: rgba(80, 160, 255, 0.25); color: #b9dbff; }
      #business .sev.medium { background: rgba(255, 179, 31, 0.25); color: #ffe0a3; }
      #business .bm-law { margin: 8px 0; font-size: 12px; }
      #business .bm-law ul { margin: 4px 0; padding-left: 16px; }
      #business .bm-law a { color: #8fd0ff; }
      #business .pill.loc-strict { background: rgba(255, 59, 59, 0.2); color: #ffb3b3; }
      #business .pill.loc-conditional, #business .pill.loc-sectoral { background: rgba(255, 179, 31, 0.18); color: #ffe0a3; }
      #business .pill.loc-none { background: rgba(26, 255, 140, 0.12); color: #9ff7c8; }
      #trace { top: 232px; left: 16px; width: 300px; }
      #trace h2 { font-size: 13px; margin: 0 0 6px; letter-spacing: 0.06em; text-transform: uppercase; color: #9fd0ff; }
      #trace .tp-form { display: grid; gap: 5px; margin: 6px 0; }
      #trace input { background: #0b1626; color: var(--text); border: 1px solid var(--border); border-radius: 5px; font: inherit; padding: 4px 6px; }
      #trace .ok { color: var(--green); }
      #trace .warn { color: var(--amber); }
      #trace .muted { color: var(--muted); }
      #trace .tp-link { color: #8fd0ff; font-size: 12px; }
      #trace .tp-attr { font-size: 10px; margin-top: 6px; }
      #trace .tp-attr a { color: var(--muted); }
      #trace .tp-setup { display: none; font-size: 11px; max-height: 40vh; overflow-y: auto; }
      #trace .tp-setup.open { display: block; }
      #trace pre { white-space: pre-wrap; word-break: break-all; background: #050b14; padding: 6px; border-radius: 4px; margin: 4px 0 8px; }
      @media (max-width: 640px) {
        #trace { left: 16px; right: 16px; width: auto; top: 200px; }
        #business { left: 16px; right: 16px; width: auto; max-height: 45vh; }
        #hud { left: 16px; right: 16px; top: 16px; }
        #inspector { left: 16px; right: 16px; top: auto; bottom: 64px; width: auto; }
        #legend { left: 16px; right: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <div id="hud" class="panel">
      <h1>PacketPulse</h1>
      <div class="row">fps <b id="s-fps">–</b></div>
      <div class="row">paths <b id="s-paths">0</b></div>
      <div class="row">segments <b id="s-segs">0</b></div>
      <div class="row">draw calls <b id="s-calls">0</b></div>
      <div class="buttons">
        <button data-demo="100">100 paths</button>
        <button data-demo="500">500</button>
        <button data-demo="1000">1000</button>
        <button id="b-example">Example journey</button>
        <button id="b-live">Live backend</button>
        <button id="b-clear">Clear</button>
        <button id="b-business" data-mode="business" title="Evaluate every path against data-sovereignty profiles">Business Mode</button>
      </div>
      <div id="status"></div>
    </div>
    <div id="trace" class="panel"></div>
    <div id="inspector" class="panel"></div>
    <div id="business" class="panel"></div>
    <div id="legend" class="panel"><span>fast</span><div class="bar"></div><span>congested / loss</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
